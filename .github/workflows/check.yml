name: Check code

on:
  pull_request:
    # `edited` re-resolves the tier when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tiers (docs/adr/0001-three-tier-ci-checks.md):
  #   noop  -> no code or build file touched
  #   cheap -> common, JVM or server code only: format, JVM tests with Sonar inline, multiplatform
  #            compile
  #   full  -> platform code or build config: adds wasm and iOS tests, Android build, standalone Sonar
  detect:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute override
        id: override
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "force=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if printf '%s' "$PR_TITLE" | grep -qi '\[skip-tests\]'; then
              echo "force=noop" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if printf '%s' "$PR_BODY" | grep -qE '\- \[x\] Force running tests'; then
              echo "force=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "force=" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.override.outputs.force == ''
        with:
          filters: |
            code:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.toml'
              - '**/*.xml'
              - '**/*.properties'
              - '**/*.sql'
              - '**/*.html'
              - '**/*.js'
              - 'server/src/test/resources/**'
              - 'gradle/wrapper/**'
              - '.github/workflows/check.yml'
              - 'Dockerfile'
              - '.dockerignore'
            platform:
              - 'androidApp/**'
              - 'composeApp/src/androidMain/**'
              - 'composeApp/src/iosMain/**'
              - 'composeApp/src/wasmJsMain/**'
              - 'composeApp/src/nonJsMain/**'
              - 'shared/src/androidMain/**'
              - 'shared/src/iosMain/**'
              - 'shared/src/wasmJsMain/**'
              - '**/AndroidManifest.xml'
              - '**/*.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'gradle/wrapper/**'
              - '.github/workflows/check.yml'

      - name: Resolve tier
        id: tier
        env:
          FORCE: ${{ steps.override.outputs.force }}
          CODE: ${{ steps.filter.outputs.code }}
          PLATFORM: ${{ steps.filter.outputs.platform }}
        run: |
          if [ -n "$FORCE" ]; then
            echo "tier=$FORCE" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" = "true" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "true" ]; then
            echo "tier=cheap" >> "$GITHUB_OUTPUT"
          else
            echo "tier=noop" >> "$GITHUB_OUTPUT"
          fi

  format-check:
    needs: detect
    if: needs.detect.outputs.tier != 'noop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew ktfmtCheck

  # Designated Gradle cache writer; every other job reads the cache only.
  jvm-tests:
    needs: detect
    if: needs.detect.outputs.tier != 'noop'
    runs-on: ubuntu-latest
    steps:
      # Full history so the inline Sonar step can compute blame for new code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: never
      # composeApp's report pulls in :shared:jvmTest through kover(projects.shared).
      - run: ./gradlew koverXmlReportJvm :server:koverXmlReport :e2e:test

      # The JVM Kover XML is the only coverage source, so on the cheap tier Sonar runs here and
      # saves the sonar-analysis job its runner, setup and recompile.
      - name: Run Sonar (cheap tier only)
        if: needs.detect.outputs.tier == 'cheap'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-configuration-cache --no-parallel --no-daemon

      # Rooted at the repo root, so sonar-analysis must download it with "path: ." to put each
      # report back where the root sonar block expects it.
      - name: Upload Kover reports
        uses: actions/upload-artifact@v7
        with:
          name: kover-report-jvm
          path: |
            composeApp/build/reports/kover/
            server/build/reports/kover/
          retention-days: 1
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-test-results
          path: |
            composeApp/build/test-results/jvmTest/*.xml
            shared/build/test-results/jvmTest/*.xml
            server/build/test-results/test/*.xml
            e2e/build/test-results/test/*.xml
          retention-days: 1

  # Cheap tier safety net for expect/actual breaks; the full tier compiles every target anyway.
  compile-multiplat:
    needs: detect
    if: needs.detect.outputs.tier == 'cheap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew :composeApp:compileAndroidMain :composeApp:compileKotlinWasmJs

  wasm-tests:
    needs: detect
    if: needs.detect.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew :shared:wasmJsBrowserTest :composeApp:wasmJsTest
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-test-results
          path: '*/build/test-results/wasmJsBrowserTest/*.xml'
          retention-days: 1

  # No instrumented tests exist yet, so the Android slot builds the app instead of booting an
  # emulator.
  android-build:
    needs: detect
    if: needs.detect.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew :androidApp:assembleDebug

  # Compose Multiplatform links against iOS 26 SDK symbols, so this needs Xcode 26.
  ios-tests:
    needs: detect
    if: needs.detect.outputs.tier == 'full'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: '*/build/test-results/iosSimulatorArm64Test/*.xml'
          retention-days: 1

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [detect, jvm-tests, wasm-tests, ios-tests]
    if: >
      always() && needs.detect.outputs.tier != 'noop' &&
      (needs.jvm-tests.result == 'success' || needs.jvm-tests.result == 'failure')
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Download JVM test results
        uses: actions/download-artifact@v8
        with:
          name: jvm-test-results
          path: test-results/jvm
      - name: Download wasm test results
        if: needs.detect.outputs.tier == 'full' && needs.wasm-tests.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: wasm-test-results
          path: test-results/wasm
      - name: Download iOS test results
        if: needs.detect.outputs.tier == 'full' && needs.ios-tests.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ios-test-results
          path: test-results/ios

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        id: test-results
        with:
          files: test-results/**/*.xml
          check_name: Test Results
          comment_title: Test Results

      - name: Set badge color
        env:
          CONCLUSION: ${{ fromJSON(steps.test-results.outputs.json).conclusion }}
        run: |
          case "$CONCLUSION" in
            success) echo "BADGE_COLOR=31c653" >> "$GITHUB_ENV" ;;
            failure) echo "BADGE_COLOR=800000" >> "$GITHUB_ENV" ;;
            neutral) echo "BADGE_COLOR=696969" >> "$GITHUB_ENV" ;;
          esac
      - name: Create badge
        uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8
        with:
          label: Tests
          status: '${{ fromJSON(steps.test-results.outputs.json).formatted.stats.tests }} tests passed'
          color: ${{ env.BADGE_COLOR }}
          path: badge.svg
      # Only the nightly full run on main updates the README badge.
      - name: Upload badge to Gist
        if: github.event_name == 'schedule'
        uses: andymckay/append-gist-action@6e8d64427fe47cbacf4ab6b890411f1d67c07f3e
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gistURL: https://gist.githubusercontent.com/Axl-Lvy/${{ secrets.GIST_ID }}
          file: badge.svg

  # Full tier counterpart of the inline Sonar step in jvm-tests.
  sonar-analysis:
    name: Sonar analysis
    runs-on: ubuntu-latest
    needs: [detect, jvm-tests]
    if: needs.detect.outputs.tier == 'full' && needs.jvm-tests.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # "." because the artifact is rooted at the repo root; see jvm-tests.
      - name: Download Kover reports
        uses: actions/download-artifact@v8
        with:
          name: kover-report-jvm
          path: .
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Analyze with coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ./gradlew sonar --no-configuration-cache --no-parallel --no-daemon -Dsonar.branch.name=main
          else
            ./gradlew sonar --no-configuration-cache --no-parallel --no-daemon
          fi

  check-status:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [detect, format-check, jvm-tests, compile-multiplat, wasm-tests, android-build, ios-tests, publish-test-results, sonar-analysis]
    if: always()
    steps:
      - name: Check job results
        env:
          TIER: ${{ needs.detect.outputs.tier }}
          FORMAT: ${{ needs.format-check.result }}
          JVM: ${{ needs.jvm-tests.result }}
          MULTIPLAT: ${{ needs.compile-multiplat.result }}
          WASM: ${{ needs.wasm-tests.result }}
          ANDROID: ${{ needs.android-build.result }}
          IOS: ${{ needs.ios-tests.result }}
          PUBLISH: ${{ needs.publish-test-results.result }}
          SONAR: ${{ needs.sonar-analysis.result }}
        run: |
          fail() { echo "$1 failed (result=$2)"; exit 1; }
          echo "Resolved tier: $TIER"
          [ "$TIER" = "noop" ] && exit 0
          [ "$FORMAT" = "success" ] || fail format-check "$FORMAT"
          [ "$JVM" = "success" ] || fail jvm-tests "$JVM"
          [ "$PUBLISH" = "success" ] || fail publish-test-results "$PUBLISH"
          if [ "$TIER" = "cheap" ]; then
            [ "$MULTIPLAT" = "success" ] || fail compile-multiplat "$MULTIPLAT"
          fi
          if [ "$TIER" = "full" ]; then
            [ "$WASM" = "success" ] || fail wasm-tests "$WASM"
            [ "$ANDROID" = "success" ] || fail android-build "$ANDROID"
            [ "$IOS" = "success" ] || fail ios-tests "$IOS"
            [ "$SONAR" = "success" ] || fail sonar-analysis "$SONAR"
          fi
          echo "All checks passed (tier=$TIER)"
